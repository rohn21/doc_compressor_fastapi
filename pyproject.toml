[project]
name = "document-compressor"
version = "0.1.0"
description = "Image and PDF compression platform"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "asyncpg",
    "psycopg[binary]",
    "celery[redis]",
    "redis",
    "pillow",
    "opencv-python-headless",
    "pymupdf",
    "python-multipart",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "httpx",
]

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # Import sorting
    "UP",     # Python upgrade suggestions
    "B",      # Bugbear
    "SIM",    # Simplification
    "C4",     # Comprehensions
    "RUF",    # Ruff-specific rules
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
